<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lernzentrum – offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f6f2;color:#1c2733;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px}
    @media (prefers-color-scheme: dark){body{background:#12151a;color:#e8ebef}}
    img{width:88px;height:88px;margin-bottom:16px}
    button{margin-top:16px;font-size:17px;padding:12px 22px;border-radius:12px;border:0;background:#2f5d8c;color:#fff}
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="">
    <h1>Gerade offline</h1>
    <p>Laufende Aufnahmen werden auf dem Gerät gespeichert und später übertragen.<br>Sobald du wieder online bist, geht es weiter.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
