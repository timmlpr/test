# Production on a Hetzner Cloud server in Germany (see deploy/hetzner-setup.sh).
#   cd lernzentrum && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: lernzentrum
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lz -d lernzentrum"], interval: 10s, retries: 10 }
  backend:
    build: { context: .., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment:
      LZ_ENV: production
      LZ_DATABASE_URL: postgresql+psycopg://lz:${POSTGRES_PASSWORD}@db:5432/lernzentrum
      LZ_MASTER_KEY: ${LZ_MASTER_KEY:?set in deploy/.env}
      LZ_SESSION_SECRET: ${LZ_SESSION_SECRET:?set in deploy/.env}
      LZ_PUBLIC_URL: https://${LZ_DOMAIN}
      LZ_COOKIE_SECURE: "true"
      LZ_DEMO_MODE: ${LZ_DEMO_MODE:-false}
    volumes: [lzdata:/data]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: { context: .., dockerfile: frontend/Dockerfile, args: { API_URL: "http://backend:8000" } }
    restart: unless-stopped
    depends_on: [backend]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { LZ_DOMAIN: "${LZ_DOMAIN:?set in deploy/.env}", ACME_EMAIL: "${ACME_EMAIL:-}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set in deploy/.env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./restore-test.sh:/restore-test.sh:ro
      - lzdata:/data:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null && while true; do /bin/sh /backup.sh && /bin/sh /restore-test.sh; sleep 86400; done"]
    depends_on: { db: { condition: service_healthy } }
volumes:
  pgdata:
  lzdata:
  caddy_data:
  caddy_config:
