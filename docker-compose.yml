# Local / demo:   docker compose up            → http://localhost:3000  (demo accounts, no keys needed)
# Production:     docker compose --profile prod up -d   (Caddy HTTPS on 80/443, backups) – see docs/DEPLOYMENT.md
name: tracelow

x-backend-env: &backend-env
  ENV: ${ENV:-development}
  DEMO_MODE: ${DEMO_MODE:-true}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
  DATABASE_URL: postgresql+psycopg://tracelow:${POSTGRES_PASSWORD:-tracelow-local}@db:5432/tracelow
  SECRET_KEY: ${SECRET_KEY:-}
  DATA_KEY: ${DATA_KEY:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracelow
      POSTGRES_USER: tracelow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracelow-local}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelow"]
      interval: 5s
      retries: 20

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    env_file: [{ path: .env, required: false }]
    environment: *backend-env
    volumes: [data:/data]
    depends_on: { db: { condition: service_healthy } }

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-http://localhost:3000}
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on: { backend: { condition: service_healthy } }

  caddy:
    profiles: [prod]
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [frontend, backend]

  backup:
    profiles: [prod]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tracelow-local}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes: ["./deploy/backup.sh:/backup.sh:ro", "./backups:/backups", "data:/data:ro"]
    entrypoint: ["sh", "-c", "apk add --no-cache openssl >/dev/null && while true; do sh /backup.sh || echo 'backup failed'; sleep 86400; done"]
    depends_on: { db: { condition: service_healthy } }

volumes: { db: {}, data: {}, caddy_data: {}, caddy_config: {} }
