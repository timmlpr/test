name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests --select F,E,I --ignore E501
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - name: migrations up to date
        run: DATABASE_URL=sqlite:////tmp/ci.db alembic upgrade head && DATABASE_URL=sqlite:////tmp/ci.db alembic check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: npm ci && npm audit --omit=dev --audit-level=high && npm run typecheck && npm run build
        working-directory: frontend
      - name: e2e (demo stack)
        run: |
          pip install -r backend/requirements.txt
          (cd backend && DEMO_MODE=true RATELIMIT_ENABLED=false SCHEDULER_ENABLED=false uvicorn app.main:app --port 8000 &)
          cd frontend && npx playwright install --with-deps chromium
          (npx next start -p 3000 -H 127.0.0.1 &) && sleep 8
          npx playwright test --trace off
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
  deploy:
    # Runs only on main when the DEPLOY_HOST secret exists. Server prepared with deploy/hetzner-setup.sh.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker]
    env: { DEPLOY_HOST: "${{ secrets.DEPLOY_HOST }}" }
    steps:
      - if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/fadeprint && git pull --ff-only && docker compose --profile prod up -d --build && docker image prune -f
